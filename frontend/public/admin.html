<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datacolab Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0f14;color:#f0f0f5;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f0f14}
.login-card{background:#1a1a24;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:40px;width:360px}
.logo{font-size:24px;font-weight:700;margin-bottom:8px}
.logo .data{color:#fff}
.logo .colab{background:linear-gradient(135deg,#5b6af0,#06d6a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:#6b6b80;margin-bottom:28px}
.label{display:block;font-size:12px;font-weight:500;color:#6b6b80;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
.input{width:100%;background:#0f0f14;border:1px solid rgba(255,255,255,0.08);color:#f0f0f5;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;margin-bottom:16px}
.input:focus{border-color:#5b6af0}
.btn{width:100%;padding:12px;background:#5b6af0;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{opacity:0.85}
.error{background:rgba(240,91,91,0.1);border:1px solid #f05b5b;color:#f05b5b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo"><span class="data">data</span><span class="colab">colab</span></div>
    <div class="sub">Admin panelə giriş</div>
    <div class="error" id="err">İstifadəçi adı və ya şifrə yanlışdır</div>
    <label class="label">İstifadəçi adı</label>
    <input class="input" id="user" type="text" placeholder="admin">
    <label class="label">Şifrə</label>
    <input class="input" id="pass" type="password" placeholder="••••••••">
    <button class="btn" onclick="login()">Daxil ol →</button>
  </div>
</div>
<script>
function login(){
  const u=document.getElementById('user').value;
  const p=document.getElementById('pass').value;
  if(u==='admin'&&p==='admin123'){
    window.location.href='/admin-panel.html';
  } else {
    document.getElementById('err').style.display='block';
  }
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
